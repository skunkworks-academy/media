name: Deploy Media site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: media-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='node_modules/'
          touch _site/.nojekyll
          test -f _site/index.html
          test "$(tr -d '\r\n' < _site/CNAME)" = "media.skunkworksacademy.com"

      - name: Enforce canonical Academy v10 shell on every HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(r'<script\b[^>]*(?:academy-navigation(?:-loader)?\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I | re.S)
          pages = []

          for path in root.rglob('*.html'):
              html = path.read_text(encoding='utf-8', errors='ignore')
              if not re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I):
                  continue
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')
              path.write_text(html, encoding='utf-8')
              pages.append(path)

          if not pages:
              raise SystemExit('Media site contains no HTML documents.')

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  missing.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))
          if missing:
              raise SystemExit('Canonical shell missing from: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate shell loaders in: ' + ', '.join(duplicate))
          print(f'Verified Academy canonical v10 shell on {len(pages)} Media page(s).')
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
